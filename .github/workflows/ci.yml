name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  # Override if Docker Hub rate-limits the runners (e.g. mirror.gcr.io/library/postgres:17-alpine).
  POSTGRES_IMAGE: postgres:17-alpine

jobs:
  quality:
    name: Quality (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with coverage (domain, contracts, mobile, api, web)
        run: pnpm test:coverage

  api-integration:
    name: API integration (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - run: pnpm --filter api test:integration

  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Regenerate OpenAPI spec and web client types
        run: |
          pnpm openapi:generate
          pnpm --filter web api:generate
      - name: Fail if generated files are out of date
        run: |
          git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/api/schema.d.ts \
            || { echo "::error::Generated OpenAPI artifacts are stale. Run 'pnpm openapi:generate && pnpm --filter web api:generate' and commit."; exit 1; }
      - name: Fail if the mobile client types are out of date
        run: |
          pnpm --filter mobile api:generate
          git diff --exit-code -- apps/mobile/lib/api/schema.d.ts \
            || { echo "::error::apps/mobile/lib/api/schema.d.ts is stale. Run 'pnpm --filter mobile api:generate' and commit."; exit 1; }

  build:
    name: Build (web, api image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - run: pnpm --filter web build
        env:
          API_URL: http://localhost:4000
      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile --build-arg NODE_IMAGE=node:24-alpine -t monaco-api:ci .

  e2e:
    name: E2E (Playwright, real API + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Superuser of the service container above. prepare.mjs only drops/creates the dedicated
      # monaco_e2e database, applies infra/postgres/init.sql, migrates and seeds it.
      E2E_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Read Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Always run: it skips the download on a cache hit but still installs the OS libraries Chromium needs.
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run E2E suite (prepares database, seed, secrets and web build first)
        run: pnpm --filter web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
